[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s-means"
version = "0.1.0"
description = "Scale- and distortion-aware single/few-epoch clustering for PyTorch, Triton GPUs, and scikit-learn"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Suayp Talha Kocabay"},
]
keywords = [
    "clustering",
    "k-means",
    "pytorch",
    "triton",
    "cuda",
    "scikit-learn",
    "vector-quantization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
triton = ["triton>=3.0"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/suayptalha/s-means"
Repository = "https://github.com/suayptalha/s-means"
Issues = "https://github.com/suayptalha/s-means/issues"

[tool.setuptools.packages.find]
include = ["smeans*"]
